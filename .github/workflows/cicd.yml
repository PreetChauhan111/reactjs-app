name: CICD

on:
  push:
    branches:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: preetchauhan/reactjs-app:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: preetchauhan/reactjs-app:latest

  deploy:
    needs: build
    # Use self-hosted runner. Replace label 'aws_ec2' with your runner label if different.
    runs-on: [ self-hosted, linux, aws-ec2 ]
    steps:
      
      - name: Pull image from docker hub
        run: docker pull integrationninjas/reactjs-app:latest 

      - name: Delete Old Container
        run: docker rm -f reactContainer
        
      - name: Run docker container
        run: docker run -d -p 3000:80 --name reactContainer integrationninjas/reactjs-app   