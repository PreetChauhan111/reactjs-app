name: CICD
on:
  push:
    branches:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t preetchauhan/reactjs-app . 
      - name: Push Docker Image
        run: docker push preetchauhan/reactjs-app:latest

  deploy:
    needs: build
    runs-on: aws_ec2
    steps:
      - name: Pull Image from Docker Hub
        run: docker pull preetchauhan/reactjs-app:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run New Container
        run: docker run -d -p 3000:80 --name reactContainer preetchauhan/reactjs-app